<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fini - Chatbot Finansial</title>
  <!-- Import Font Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-container">
    <!-- Header -->
    <div class="header">
      <h1>FINI.BOT 💸</h1>
      <p>Asisten Finansial Neo-Brutalist</p>
    </div>

    <!-- Area Chat -->
    <div id="chat-box" class="chat-container">
      <div class="message bot">
        Halo! Aku Fini, asisten finansial kamu. Mau ngobrolin soal nabung, investasi, atau budgeting hari ini? ✨
      </div>
    </div>

    <!-- Form Input -->
    <form id="chat-form" class="input-area">
      <input type="text" id="user-input" placeholder="Tanya soal keuangan di sini..." autocomplete="off" />
      <button type="submit" id="send-btn">KIRIM</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>

</html>
